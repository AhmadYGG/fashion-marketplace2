<html>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="style.css">
    <script src="js/jquery.js"></script>
    <script src="js/bootstrap.js"></script>
</head>
<body>

<header>
    <h1>Pinky Fashion Store</h1>
    <div class="menu-top">
        <a href="index.html">Beranda</a>
        <a href="tentang.html">Tentang Kami</a>
        <a href="cara-belanja.html">Cara Belanja</a>
        <a href="kebijakan.html">Kebijakan</a>
        <a href="keranjang.html">Keranjang</a>
        <a href="kontak.html">Kontak</a>
         
    </div>
</header>

<section class="hero">
    <img src="images/banner-general.jpg" alt="Banner">
</section>

<div class="container">
    <main class="content" style="max-width: 100%; margin-left: 0;">
        <div class="cart-wrapper">
            <div class="cart-main">
                <h2>Keranjang Belanja</h2>
                <div class="cart-container" id="cart-container">
                    <!-- Cart items akan di-render oleh JavaScript -->
                </div>
            </div>

            <div class="cart-summary-card">
                <h3>Ringkasan</h3>
                <div id="cart-summary-items"></div>
                <div class="cart-summary-divider"></div>
                <div class="cart-summary-total">
                    <span>Total</span>
                    <span id="cart-total-amount" class="total-amount">Rp 0</span>
                </div>
                <button class="cart-btn-primary" onclick="window.location.href='checkout.html'">Lanjut ke Checkout</button>
                <button class="cart-btn-secondary" onclick="window.location.href='index.html'">Lanjut Belanja</button>
            </div>
        </div>
    </main>
</div>
