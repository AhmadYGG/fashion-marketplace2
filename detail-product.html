<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Produk - Pinky Fashion Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="style.css">
    <script src="js/jquery.js"></script>
    <script src="js/bootstrap.js"></script>
</head>
<body>

<header>
    <h1>Pinky Fashion Store</h1>
    <div class="menu-top">
        <a href="index.html">Beranda</a>
        <a href="tentang.html">Tentang Kami</a>
        <a href="cara-belanja.html">Cara Belanja</a>
        <a href="kebijakan.html">Kebijakan</a>
        <a href="keranjang.html">Keranjang</a>
        <a href="kontak.html">Kontak</a>
        <a href="login.html">Login</a>
    </div>
</header>

<div class="container">
    <aside class="sidebar">
        <h3>Kategori</h3>
        <ul>
            <li><a href="index.html">Produk Terbaru</a></li>
            <li><a href="pria.html">Fashion Pria</a></li>
            <li><a href="wanita.html">Fashion Wanita</a></li>
            <li><a href="promo.html">Produk Promo</a></li>
        </ul>
    </aside>

    <main class="content">
        <div class="product-detail-container">
            <div class="product-detail-image">
                <img id="detail-image" src="" alt="Product Image">
            </div>
            
            <div class="product-detail-info">
                <h2 id="detail-name"></h2>
                
                <div class="detail-rating">
                    <div class="rating-stars" id="detail-stars"></div>
                    <span class="rating-number" id="detail-rating-number"></span>
                </div>
                
                <p class="detail-price" id="detail-price"></p>
                
                <div class="product-specs">
                    <h4>Spesifikasi Produk</h4>
                    <div class="specs-grid">
                        <div class="spec-item">
                            <span class="spec-label">Kategori</span>
                            <span class="spec-value" id="detail-kategori">-</span>
                        </div>
                        <div class="spec-item">
                            <span class="spec-label">Material</span>
                            <span class="spec-value" id="detail-material">-</span>
                        </div>
                        <div class="spec-item">
                            <span class="spec-label">Warna</span>
                            <span class="spec-value" id="detail-warna">-</span>
                        </div>
                        <div class="spec-item">
                            <span class="spec-label">Ukuran</span>
                            <span class="spec-value" id="detail-ukuran">-</span>
                        </div>
                    </div>
                </div>
                
                <div class="detail-description">
                    <h3>Deskripsi Produk</h3>
                    <p id="detail-description"></p>
                </div>
                
                <button class="add-to-cart-btn" onclick="addToCart({id: productId, name: document.getElementById('detail-name').textContent, price: parseInt(document.getElementById('detail-price').textContent.replace(/[^0-9]/g, '')), image: document.getElementById('detail-image').src})">Masukkan Keranjang</button>
                <button class="back-btn-detail" onclick="history.back()">Kembali</button>
            </div>
        </div>
    </main>
</div>

<footer>
    <p>© 2026 Pinky Fashion Store - All Rights Reserved</p>
</footer>

<script src="js/product-data.js"></script>
<script>
    function getUrlParameter(name) {
        name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
        var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
        var results = regex.exec(location.search);
        return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
    }
    
    var productId = parseInt(getUrlParameter('id'));
    var productType = getUrlParameter('type') || 'wanita';
    var isWanita = productType === 'wanita';
    
    if(productId || productId === 0) {
        var product = getProductById(productId, isWanita);
        
        if(product) {
            var productName = isWanita ? product.nama : product.nama;
            var kategori = isWanita ? product.kategori : product.kategori;
            var material = isWanita ? product.material : product.material;
            var warna = isWanita ? product.warna : product.warna;
            var ukuran = isWanita ? product.ukuran : product.fit_ukuran;
            var harga = isWanita ? product.harga : product.harga;
            
            var imagePath = isWanita ? 
                'images/fashion-cewe/' + String(productId + 1).padStart(3, '0') + '.webp' :
                'images/fashion-cowo/' + String(productId + 1).padStart(3, '0') + '.webp';
            
            var description = getProductDescription(productName, isWanita);
            
            document.getElementById('detail-image').src = imagePath;
            document.getElementById('detail-image').alt = productName;
            document.getElementById('detail-name').textContent = productName;
            document.getElementById('detail-price').textContent = 'Rp ' + harga.toLocaleString('id-ID');
            document.getElementById('detail-kategori').textContent = kategori || '-';
            document.getElementById('detail-material').textContent = material || '-';
            document.getElementById('detail-warna').textContent = warna || '-';
            document.getElementById('detail-ukuran').textContent = ukuran || '-';
            document.getElementById('detail-description').textContent = description;
            
            var rating = (4 + Math.random()).toFixed(1);
            document.getElementById('detail-rating-number').textContent = rating;
            
            var fullStars = Math.floor(rating);
            var hasHalfStar = rating % 1 >= 0.5;
            var starsHTML = '';
            
            for(var j = 0; j < fullStars; j++) {
                starsHTML += '<span class="star">★</span>';
            }
            if(hasHalfStar) {
                starsHTML += '<span class="star">★</span>';
            }
            for(var k = fullStars + (hasHalfStar ? 1 : 0); k < 5; k++) {
                starsHTML += '<span class="star empty">★</span>';
            }
            
            document.getElementById('detail-stars').innerHTML = starsHTML;
        }
    }
</script>

    <script src="js/cart.js"></script>
</body>
</html>
