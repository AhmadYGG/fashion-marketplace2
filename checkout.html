<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Pinky Fashion Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="style.css">
    <script src="js/jquery.js"></script>
    <script src="js/bootstrap.js"></script>
</head>
<body>

<header>
    <h1>Pinky Fashion Store</h1>
    <div class="menu-top">
        <a href="index.html">Beranda</a>
        <a href="tentang.html">Tentang Kami</a>
        <a href="cara-belanja.html">Cara Belanja</a>
        <a href="kebijakan.html">Kebijakan</a>
        <a href="keranjang.html">Keranjang</a>
        <a href="kontak.html">Kontak</a>
         
    </div>
</header>

<section class="hero">
    <img src="images/banner-general.jpg" alt="Banner">
</section>

<div class="container">
    <main class="content" style="max-width: 100%; margin-left: 0;">
        <div class="checkout-wrapper">
            <div class="checkout-main">
                <h2>Checkout</h2>
                
                <div class="checkout-items-section">
                    <h3>Pesanan Anda</h3>
                    <div id="checkout-items" class="checkout-items-list"></div>
                    <div class="form-group">
                        <label for="additional-notes">Catatan Tambahan</label>
                        <textarea id="additional-notes" class="form-control" rows="3" placeholder="Contoh: Ukuran M, warna biru, dll"></textarea>
                    </div>
                </div>

                <div class="checkout-address-section">
                    <h3>Data Pengiriman</h3>
                    <div class="form-group">
                        <label for="recipient-name">Nama Penerima</label>
                        <input type="text" id="recipient-name" class="form-control" placeholder="Masukkan nama penerima" required>
                    </div>
                    <div class="form-group">
                        <label for="recipient-phone">Nomor HP</label>
                        <input type="text" id="recipient-phone" class="form-control" placeholder="Masukkan nomor HP (contoh: 08123456789)" required>
                    </div>
                    <div class="form-group">
                        <label for="recipient-address">Alamat Pengiriman</label>
                        <textarea id="recipient-address" class="form-control" rows="4" placeholder="Masukkan alamat lengkap pengiriman" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="expedition">Pilih Ekspedisi</label>
                        <select id="expedition" class="form-control" required>
                            <option value="">-- Pilih Ekspedisi --</option>
                            <option value="jne">JNE</option>
                            <option value="tiki">TIKI</option>
                            <option value="pos">POS Indonesia</option>
                            <option value="grab">Grab Express</option>
                            <option value="gojek">GoJek</option>
                        </select>
                    </div>
                </div>

                <div class="checkout-payment-section">
                    <h3>Metode Pembayaran</h3>
                    <div class="payment-methods">
                        <label class="payment-option">
                            <input type="radio" name="payment" value="transfer" checked>
                            <span>Transfer Bank</span>
                        </label>
                        <label class="payment-option">
                            <input type="radio" name="payment" value="cod">
                            <span>Cash on Delivery (COD)</span>
                        </label>
                        <label class="payment-option">
                            <input type="radio" name="payment" value="qris">
                            <span>QRIS</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="checkout-summary-card">
                <h3>Rincian Harga</h3>
                <div id="checkout-summary-items"></div>
                <div class="checkout-summary-total">
                    <span>Total</span>
                    <span id="checkout-total" class="total-amount">Rp 0</span>
                </div>
                <button class="checkout-btn-primary" onclick="processCheckout()">Pesan Sekarang</button>
                <button class="checkout-btn-secondary" onclick="window.location.href='keranjang.html'">Kembali</button>
            </div>
        </div>
    </main>
</div>

<footer>
    <p>© 2026 Pinky Fashion Store - All Rights Reserved</p>
</footer>

<script>
    function loadOrderSummary() {
        // Ambil data keranjang dari localStorage
        const cart = JSON.parse(localStorage.getItem('cart')) || [];
        var summaryContainer = document.getElementById('checkout-summary-items');
        var total = 0;
        
        if (cart.length === 0) {
            summaryContainer.innerHTML = '<p style="text-align: center; padding: 20px;">Keranjang Anda kosong</p>';
            document.getElementById('checkout-total').innerText = 'Rp 0';
            window.orderTotal = 0;
            return;
        }
        
        var html = '';
        for(var i = 0; i < cart.length; i++) {
            var subtotal = cart[i].price * cart[i].quantity;
            total += subtotal;
            
            html += 
                '<div class="summary-item">' +
                '<span class="summary-item-name">' + cart[i].name + '</span>' +
                '<span class="summary-item-qty">x' + cart[i].quantity + '</span>' +
                '<span class="summary-item-price">Rp ' + subtotal.toLocaleString('id-ID') + '</span>' +
                '</div>';
        }
        
        summaryContainer.innerHTML = html;
        document.getElementById('checkout-total').innerText = 'Rp ' + total.toLocaleString('id-ID');
        
        // Store total for success message
        window.orderTotal = total;
    }
    
    function processCheckout() {
        var additionalNotes = document.getElementById('additional-notes').value.trim();
        var recipientName = document.getElementById('recipient-name').value.trim();
        var recipientPhone = document.getElementById('recipient-phone').value.trim();
        var recipientAddress = document.getElementById('recipient-address').value.trim();
        var expedition = document.getElementById('expedition').value.trim();
        var selectedPayment = document.querySelector('input[name="payment"]:checked');
        
        if(!recipientName) {
            alert('Silakan masukkan nama penerima!');
            return;
        }
        
        if(!recipientPhone) {
            alert('Silakan masukkan nomor HP!');
            return;
        }
        
        if(!recipientAddress) {
            alert('Silakan masukkan alamat pengiriman!');
            return;
        }
        
        if(!expedition) {
            alert('Silakan pilih ekspedisi!');
            return;
        }
        
        if(selectedPayment) {
            var paymentMethod = selectedPayment.nextElementSibling.innerText;
            var totalFormatted = 'Rp ' + window.orderTotal.toLocaleString('id-ID');
            
            // Ambil data keranjang dari localStorage
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            
            // Build order items list
            var itemsList = '';
            for(var i = 0; i < cart.length; i++) {
                var subtotal = cart[i].price * cart[i].quantity;
                itemsList += (i + 1) + '. ' + cart[i].name + ' (x' + cart[i].quantity + ') = Rp ' + subtotal.toLocaleString('id-ID') + '\n';
            }
            
            // Build WhatsApp message dengan format yang lebih baik
            var message = 'Halo Kak, saya ingin memesan produk berikut:\n\n' +
                         '*DETAIL PESANAN*\n' +
                         '━━━━━━━━━━━━━━━━━━━━━━\n' + 
                         itemsList + 
                         '━━━━━━━━━━━━━━━━━━━━━━\n' +
                         '*Total: ' + totalFormatted + '*\n' +
                         '(belum termasuk ongkir)\n\n' +
                         '*DATA PENGIRIMAN*\n' +
                         'Nama Penerima : ' + recipientName + '\n' +
                         'No. HP        : ' + recipientPhone + '\n' +
                         'Alamat        : ' + recipientAddress + '\n\n' +
                         '*Ekspedisi* : ' + expedition.toUpperCase() + '\n' +
                         '*Metode Pembayaran* : ' + paymentMethod + '\n\n';
            
            // Tambahkan catatan jika ada
            if(additionalNotes) {
                message += '*Catatan Tambahan* : ' + additionalNotes + '\n\n';
            }
            
            message += 'Mohon info nomor rekening dan total ongkirnya ya Kak. Terima kasih!';
            
            // Redirect to WhatsApp
            var whatsappNumber = '6285143102063';
            var whatsappUrl = 'https://wa.me/' + whatsappNumber + '?text=' + encodeURIComponent(message);
            window.open(whatsappUrl, '_blank');
            
            // Show success message
            setTimeout(function() {
                var checkoutMain = document.querySelector('.checkout-main');
                checkoutMain.innerHTML = 
                    '<div class="success-notification" style="margin-top: 0;">' +
                    '<h3>✅ PESANAN BERHASIL DIKIRIM KE WHATSAPP!</h3>' +
                    '<p style="font-size: 16px; margin: 20px 0; color: #666;">Pesanan Anda telah dikirim ke WhatsApp admin kami.</p>' +
                    '<div style="background-color: #f0f0f0; padding: 20px; border-radius: 8px; margin: 20px 0; text-align: left;">' +
                    '<p style="margin: 0 0 15px 0; font-weight: 600; color: #333;"><strong>📋 Ringkasan Pesanan:</strong></p>' +
                    '<p style="margin: 8px 0; color: #666;">• Total: ' + totalFormatted + '</p>' +
                    '<p style="margin: 8px 0; color: #666;">• Penerima: ' + recipientName + '</p>' +
                    '<p style="margin: 8px 0; color: #666;">• No. HP: ' + recipientPhone + '</p>' +
                    '<p style="margin: 8px 0; color: #666;">• Ekspedisi: ' + expedition.toUpperCase() + '</p>' +
                    '<p style="margin: 8px 0; color: #666;">• Metode: ' + paymentMethod + '</p>' +
                    (additionalNotes ? '<p style="margin: 8px 0; color: #666;">• Catatan: ' + additionalNotes + '</p>' : '') +
                    '</div>' +
                    '<p style="color: #666; font-size: 14px; margin: 15px 0;">📱 Silakan tunggu balasan dari admin kami di WhatsApp untuk konfirmasi dan detail pembayaran.</p>' +
                    '<p style="margin-top: 20px; color: #333;">Terima kasih telah berbelanja di Pinky Fashion Store! 🛍️</p>' +
                    '</div>';
                
                var summaryCard = document.querySelector('.checkout-summary-card');
                summaryCard.innerHTML = 
                    '<button class="checkout-btn-primary" onclick="window.location.href=\'index.html\'" style="margin-top: 0;">Kembali ke Beranda</button>';
            }, 500);
        } else {
            alert('Silakan pilih metode pembayaran!');
        }
    }
    
    window.onload = function() {
        loadOrderSummary();
    };
</script>

    <script src="js/cart.js"></script>
</body>
</html>
