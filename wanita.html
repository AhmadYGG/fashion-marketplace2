<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produk Wanita - Pinky Fashion Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="style.css">
    <script src="js/jquery.js"></script>
    <script src="js/bootstrap.js"></script>
    <script src="js/product-data.js"></script>
</head>
<body>

<header>
    <h1>Pinky Fashion Store</h1>
    <div class="menu-top">
        <a href="index.html">Beranda</a>
        <a href="tentang.html">Tentang Kami</a>
        <a href="cara-belanja.html">Cara Belanja</a>
        <a href="kebijakan.html">Kebijakan</a>
        <a href="keranjang.html">Keranjang</a>
        <a href="kontak.html">Kontak</a>
    </div>
</header>

<section class="hero">
    <img src="images/banner-cewe.png" alt="Banner Wanita">
</section>

<div class="container">
    <aside class="sidebar">
        <h3>Kategori Fashion</h3>
        <ul>
            <li><a href="index.html">Produk Terbaru</a></li>
            <li><a href="pria.html">Fashion Pria</a></li>
            <li><a href="wanita.html">Fashion Wanita</a></li>
            <li><a href="promo.html">Produk Promo</a></li>
        </ul>
    </aside>

    <main class="content">
        <h2>Produk Fashion Wanita</h2>
        
        <div class="product-grid" id="product-grid">
            <!-- Products akan di-render oleh JavaScript -->
        </div>
    </main>
</div>

<footer>
    <p>© 2026 Pinky Fashion Store - All Rights Reserved</p>
</footer>

<script>
    // Render produk wanita dari data
    function renderProductsWanita() {
        const gridContainer = document.getElementById('product-grid');
        let html = '';
        
        productDataWanita.forEach((product, index) => {
            const imagePath = 'images/fashion-cewe/' + String(index + 1).padStart(3, '0') + '.webp';
            const rating = (4 + Math.random()).toFixed(1);
            
            html += `
                <div class="product-card" onclick="window.location.href='detail-product.html?id=${index}&type=wanita'">
                    <img src="${imagePath}" alt="${product.nama}">
                    <h3>${product.nama}</h3>
                    <div class="product-footer">
                        <p class="price">Rp ${product.harga.toLocaleString('id-ID')}</p>
                        <div class="rating">
                            <span class="star">★</span>
                            <span class="rating-number">${rating}</span>
                        </div>
                    </div>
                </div>
            `;
        });
        
        gridContainer.innerHTML = html;
    }
    
    // Render saat halaman load
    document.addEventListener('DOMContentLoaded', function() {
        renderProductsWanita();
    });
</script>

    <script src="js/cart.js"></script>
</body>
</html>
