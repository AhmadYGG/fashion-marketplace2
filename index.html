<script src="js/product-data.js"></script>
<script>
    var products = [];
    var prices = [];
    var images = [];
    var ratings = [];
    var productTypes = [];
    
    // Wanita products (0-19)
    for(var i = 0; i < productDataWanita.length; i++) {
        products[i] = productDataWanita[i].nama;
        prices[i] = productDataWanita[i].harga.toString();
        images[i] = 'images/fashion-cewe/' + productDataWanita[i].kode + '.webp';
        productTypes[i] = 'wanita';
        ratings[i] = (4 + Math.random()).toFixed(1);
    }
    
    // Pria products (20-39)
    for(var i = 0; i < productDataPria.length; i++) {
        products[20 + i] = productDataPria[i].nama;
        prices[20 + i] = productDataPria[i].harga.toString();
        images[20 + i] = 'images/fashion-cowo/' + String(productDataPria[i].no).padStart(3, '0') + '.webp';
        productTypes[20 + i] = 'pria';
        ratings[20 + i] = (4 + Math.random()).toFixed(1);
    }

    var currentPage = 1;
    var itemsPerPage = 20;
    var totalPages = Math.ceil(products.length / itemsPerPage);

    function displayProducts(page) {
        var container = document.getElementById('product-container');
        container.innerHTML = '';
        
        for(var i = 0; i < products.length; i++) {
            var productCard = document.createElement('div');
            productCard.className = 'product-card';
            productCard.onclick = (function(index, type) {
                return function() {
                    window.location.href = 'detail-product.html?id=' + index + '&type=' + type;
                };
            })(i < 20 ? i : i - 20, productTypes[i]);
            
            productCard.innerHTML = 
                "<img src='" + images[i] + "' alt='" + products[i] + "'>" +
                "<h3>" + products[i] + "</h3>" +
                "<div class='product-footer'>" +
                "<p class='price'>Rp " + parseInt(prices[i]).toLocaleString('id-ID') + "</p>" +
                "<div class='rating'>" +
                "<span class='star'>★</span>" +
                "<span class='rating-number'>" + ratings[i] + "</span>" +
                "</div>" +
                "</div>";
            container.appendChild(productCard);
        }
    }

    displayProducts(1);
</script>

</body>
